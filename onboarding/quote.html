<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get a Junk Removal Price | Brand Name</title>
  <meta name="description" content="Tell us how much of a truck your junk fills and get a junk removal price in Gresham and East County in about a minute. No card needed, no phone call." />
  <link rel="canonical" href="https://www.example.com/onboarding/quote.html" />
  <style>
    @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 300 700; font-display: swap; src: url(/fonts/dm-sans.woff2) format('woff2'); }
    @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 400 600; font-display: swap; src: url(/fonts/playfair.woff2) format('woff2'); }
    .qf { display: grid; gap: 18px; margin-top: 28px; }
    .qf label { display: grid; gap: 6px; font-weight: 600; }
    .qf input, .qf select, .qf textarea { font: inherit; font-size: 16px; min-height: var(--tap); padding: 10px 12px; border: 1px solid var(--bdr); border-radius: var(--r-sm); background: var(--card); color: var(--tx); }
    .qf-result { font-size: 18px; }
  </style>
  <link rel="stylesheet" href="../css/site.css">
</head>
<body>
<main id="main">
<section class="band">
  <div class="wrap-text">
    <div class="section-head">
      <p class="eyebrow">Free price</p>
      <h1 class="section-title">Get my junk removal price</h1>
      <div class="rule"></div>
    </div>

    <!-- The ZIP comes first: coverage yes or no before any personal details. -->
    <form class="qf" id="quoteForm" novalidate>
      <label>ZIP code <input name="zip" inputmode="numeric" maxlength="5" autocomplete="postal-code" required></label>
      <label>How much of a truck? <select name="load" id="loadSelect" required></select></label>
      <label>What is it? (optional) <textarea name="notes" rows="3"></textarea></label>
      <label>Name <input name="name" autocomplete="name" required></label>
      <label>Phone <input name="phone" type="tel" autocomplete="tel" required></label>
      <label>Email (optional) <input name="email" type="email" autocomplete="email"></label>
      <button class="btn-primary" type="submit">Get my price →</button>
      <p class="qf-result" id="quoteResult" aria-live="polite"></p>
    </form>
  </div>
</section>
</main>

<script>
  var form = document.getElementById('quoteForm');
  var out = document.getElementById('quoteResult');

  fetch('/api/price').then(function (r) { return r.json(); }).then(function (d) {
    document.getElementById('loadSelect').innerHTML = d.loads.map(function (l) {
      return '<option value="' + l.key + '">' + l.label + ' (' + l.hint + ')</option>';
    }).join('');
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var body = Object.fromEntries(new FormData(form));
    out.textContent = 'Working on it...';
    fetch('/api/quote-request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) out.textContent = 'Your price: ' + d.price + '. We will text you to set a time.';
      else if (d.outside) out.textContent = 'Sorry, that ZIP code is outside our service area.';
      else out.textContent = d.error || 'Something went wrong. Please call us.';
    }).catch(function () { out.textContent = 'Something went wrong. Please call us.'; });
  });
</script>
</body>
</html>
